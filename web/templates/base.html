<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HillTrade{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 8px;
      color: #94a3b8; font-size: 14px; font-weight: 500;
      transition: background 0.15s, color 0.15s; text-decoration: none;
    }
    .nav-link:hover { background: #334155; color: #fff; }
    .nav-link.active { background: #4f46e5; color: #fff; }
    .badge-buy          { background:#dcfce7; color:#166534; }
    .badge-overweight   { background:#d1fae5; color:#065f46; }
    .badge-hold         { background:#f1f5f9; color:#475569; }
    .badge-underweight  { background:#fee2e2; color:#991b1b; }
    .badge-sell         { background:#fecaca; color:#7f1d1d; }
    .badge-running      { background:#ede9fe; color:#5b21b6; }
    .badge-pending      { background:#f1f5f9; color:#64748b; }
    .badge-failed       { background:#fee2e2; color:#991b1b; }
    .badge-completed    { background:#dcfce7; color:#166534; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid #c7d2fe;
      border-top-color: #4f46e5; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prose-report h1, .prose-report h2, .prose-report h3 {
      font-weight: 600; margin-top: 1rem; margin-bottom: 0.4rem;
    }
    .prose-report h1 { font-size: 1.15rem; }
    .prose-report h2 { font-size: 1rem; }
    .prose-report h3 { font-size: 0.9rem; }
    .prose-report p  { margin-bottom: 0.5rem; font-size: 0.875rem; line-height: 1.6; }
    .prose-report ul, .prose-report ol { padding-left: 1.2rem; margin-bottom: 0.5rem; font-size: 0.875rem; }
    .prose-report li  { margin-bottom: 0.2rem; }
    .prose-report strong { font-weight: 600; }
    .prose-report table { width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-bottom: 0.6rem; }
    .prose-report th, .prose-report td { padding: 4px 8px; border: 1px solid #e2e8f0; text-align: left; }
    .prose-report th { background: #f8fafc; font-weight: 600; }
  </style>
</head>
<body class="h-full bg-slate-50">
<div class="flex min-h-screen">

  <!-- ── Sidebar ──────────────────────────────────────────────────── -->
  <aside class="w-56 bg-slate-900 flex flex-col shrink-0 sticky top-0 h-screen">
    <!-- Brand -->
    <div class="flex items-center gap-2.5 px-4 py-4 border-b border-slate-700">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
      </div>
      <div>
        <div class="text-white font-bold text-sm leading-tight">HillTrade</div>
        <div class="text-slate-400 text-xs leading-tight">AI Research Desk</div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-3 space-y-0.5">
      {% set p = request.url.path %}
      <a href="/news" class="nav-link {% if p.startswith('/news') %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
        </svg>
        News Analyser
      </a>
      <a href="/dashboard" class="nav-link {% if p == '/dashboard' %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Stock Analysis
      </a>
      <a href="/history" class="nav-link {% if p.startswith('/history') %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        History
      </a>
    </nav>

    <!-- User + Logout -->
    <div class="px-2 py-3 border-t border-slate-700 space-y-0.5">
      <a href="/profile" class="nav-link {% if p.startswith('/profile') %}active{% endif %}">
        <div class="w-6 h-6 rounded-full bg-indigo-500 flex items-center justify-center text-white text-xs font-bold shrink-0">
          {{ session.uname[0].upper() if session else '?' }}
        </div>
        {{ session.uname if session else '' }}
      </a>
      <form method="post" action="/logout">
        <button type="submit" class="nav-link w-full text-left cursor-pointer">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sign out
        </button>
      </form>
    </div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <main class="flex-1 overflow-y-auto">
    {% block content %}{% endblock %}
  </main>

</div>
{% block scripts %}{% endblock %}
</body>
</html>

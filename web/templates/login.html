<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in — HillTrade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>body{font-family:'Inter',system-ui,sans-serif;}</style>
</head>
<body class="h-full bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex items-center justify-center p-4 min-h-screen">

  <div class="w-full max-w-sm">
    <!-- Wordmark -->
    <div class="flex justify-center mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-900/50">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
        <span class="text-white font-bold text-2xl tracking-tight">HillTrade</span>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="mb-6">
        <h1 class="text-xl font-bold text-slate-900">Welcome back</h1>
        <p class="text-sm text-slate-500 mt-1">Sign in to your trading analysis account</p>
      </div>

      {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-red-700 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}"/>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <input type="text" name="username" autocomplete="username" autofocus required
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-slate-900 text-sm
                   placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="e.g. Priyank"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" name="password" autocomplete="current-password" required
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-slate-900 text-sm
                   placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="••••••••"/>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold
                 py-2.5 px-4 rounded-lg text-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 mt-2">
          Sign in &rarr;
        </button>
      </form>
    </div>
    <p class="text-center text-slate-500 text-xs mt-6">Multi-Agent LLM Trading Framework &mdash; HillTrade &copy; 2026</p>
  </div>

</body>
</html>

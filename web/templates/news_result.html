{% extends "base.html" %}
{% block title %}News Analysis — HillTrade{% endblock %}

{% block content %}
<div class="px-6 py-6 max-w-6xl mx-auto" id="news-root">

  <!-- Top bar -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/news" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="text-lg font-bold text-slate-900 leading-snug" id="event-title">Analysing…</h1>
      <p class="text-slate-500 text-xs mt-0.5 line-clamp-1">{{ analysis.news_text[:140] }}{% if analysis.news_text|length > 140 %}…{% endif %}</p>
    </div>
    <div id="status-badge" class="badge-running text-xs font-semibold px-2.5 py-1 rounded-full">Running</div>
  </div>

  <!-- Agent progress panel (shown while running) -->
  <div id="progress-panel" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-6">
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Analysis Progress</p>
    <div id="agent-table" class="space-y-2"></div>
  </div>

  <!-- Results (hidden until complete) -->
  <div id="results-panel" class="hidden space-y-6">

    <!-- Classification + Summary -->
    <div id="section-classification" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"></div>

    <!-- Historical Analogues -->
    <div id="section-analogues" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- Causal Chain -->
    <div id="section-causal" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- Sector Rotation -->
    <div id="section-rotation" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- US Stocks -->
    <div id="section-us" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- India Stocks -->
    <div id="section-india" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- Macro Overlay -->
    <div id="section-macro" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 hidden"></div>

    <!-- Synthesis / Final Verdict -->
    <div id="section-synthesis" class="hidden"></div>

  </div>

  <!-- Error panel -->
  <div id="error-panel" class="hidden bg-red-50 border border-red-200 rounded-xl p-5 text-red-800 text-sm"></div>

</div>
{% endblock %}

{% block scripts %}
<script>
  window.NEWS_ANALYSIS_ID    = "{{ analysis.id }}";
  window.NEWS_INITIAL_STATUS = "{{ analysis.status }}";
  window.NEWS_INITIAL_EVENTS = {{ initial_events_json | safe }};
</script>
<script src="/static/news.js"></script>
<script>initNewsPage();</script>
{% endblock %}
